<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Shape Dance</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #000010 0%, #000000 100%);
      font-family: Arial, sans-serif;
      color: white;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="info">✨ Click to spawn shapes • Drag to paint trails</div>
  <canvas id="universe"></canvas>

  <script>
    const canvas = document.getElementById('universe');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const shapes = [];

    class Shape {
      constructor(x, y, size, color, type) {
        this.spawnX = x;
        this.spawnY = y;
        this.x = x;
        this.y = y;
        this.size = size;
        this.color = color;
        this.type = type;
        this.angle = Math.random() * Math.PI * 2;
        this.orbitRadius = 20 + Math.random() * 60;
        this.speed = 0.01 + Math.random() * 0.02;
      }
      update() {
        this.angle += this.speed;
        this.x = this.spawnX + Math.cos(this.angle) * this.orbitRadius;
        this.y = this.spawnY + Math.sin(this.angle) * this.orbitRadius;
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 20;
        ctx.beginPath();
        if (this.type === 'circle') {
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        } else if (this.type === 'square') {
          ctx.rect(this.x - this.size, this.y - this.size, this.size * 2, this.size * 2);
        } else if (this.type === 'triangle') {
          ctx.moveTo(this.x, this.y - this.size);
          ctx.lineTo(this.x - this.size, this.y + this.size);
          ctx.lineTo(this.x + this.size, this.y + this.size);
          ctx.closePath();
        } else {
          // pentagon
          for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            const px = this.x + Math.cos(angle) * this.size;
            const py = this.y + Math.sin(angle) * this.size;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
        }
        ctx.fill();
      }
    }

    function randomColor() {
      const colors = ['#ffcc00', '#ff6699', '#66ccff', '#99ff99', '#ff9966'];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function randomShapeType() {
      const types = ['circle', 'square', 'triangle', 'polygon'];
      return types[Math.floor(Math.random() * types.length)];
    }

    function addShape(x, y) {
      shapes.push(new Shape(x, y, 8 + Math.random() * 12, randomColor(), randomShapeType()));
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      shapes.forEach(shape => {
        shape.update();
        shape.draw();
      });
      requestAnimationFrame(animate);
    }

    animate();

    // Click spawns one shape at pointer
    canvas.addEventListener('click', e => {
      addShape(e.clientX, e.clientY);
    });

    // Drag spawns trails of shapes
    let dragging = false;
    canvas.addEventListener('mousedown', () => { dragging = true; });
    canvas.addEventListener('mouseup', () => { dragging = false; });
    canvas.addEventListener('mousemove', e => {
      if (dragging) {
        for (let i = 0; i < 2; i++) {
          addShape(
            e.clientX + Math.random() * 30 - 15,
            e.clientY + Math.random() * 30 - 15
          );
        }
      }
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
  <link rel="stylesheet" href="style.css">
</body>
</html>
